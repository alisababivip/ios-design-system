name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/tokens/src/**'
      - 'packages/core/src/**'
  workflow_dispatch:   # cho phép chạy thủ công từ Actions tab

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Build VitePress Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần cho VitePress lastUpdated

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens & core (dependencies)
        run: pnpm build --filter @nlpgroup/tokens --filter @nlpgroup/core

      - name: Build Docs site
        run: pnpm --filter docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Tuỳ chọn: Deploy Showcase lên Vercel ───────────────────
  deploy-showcase:
    name: Deploy Showcase (Vercel)
    runs-on: ubuntu-latest
    needs: build-docs
    if: ${{ vars.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install & Build Showcase
        run: pnpm install --frozen-lockfile && pnpm --filter showcase build

      - name: Deploy to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} apps/showcase/dist
