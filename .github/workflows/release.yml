name: Release & Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write       # tạo GitHub Release
      packages: write       # publish lên GitHub Packages
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # setup-node tự inject authToken vào ~/.npmrc khi registry-url được set
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alisababivip'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build chỉ packages có thể build được (bỏ qua packages chưa có src)
      - name: Build tokens
        run: pnpm --filter @alisababivip/tokens run build --if-present || true

      - name: Build icons (generate SVGs)
        run: pnpm --filter @alisababivip/icons run generate --if-present || true

      # ── Publish từng package lên GitHub Packages ───────────
      - name: Publish @alisababivip/tokens
        run: pnpm publish --filter @alisababivip/tokens --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alisababivip/icons
        run: pnpm publish --filter @alisababivip/icons --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alisababivip/core
        run: pnpm publish --filter @alisababivip/core --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alisababivip/vue
        run: pnpm publish --filter @alisababivip/vue --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alisababivip/react
        run: pnpm publish --filter @alisababivip/react --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @alisababivip/blade
        run: pnpm publish --filter @alisababivip/blade --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Tạo GitHub Release tự động ─────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 📦 Packages Published to GitHub Packages

            | Package | Version | Install |
            |---------|---------|---------|
            | `@alisababivip/tokens` | `${{ github.ref_name }}` | `pnpm add @alisababivip/tokens@${{ github.ref_name }}` |
            | `@alisababivip/icons`  | `${{ github.ref_name }}` | `pnpm add @alisababivip/icons@${{ github.ref_name }}` |
            | `@alisababivip/core`   | `${{ github.ref_name }}` | `pnpm add @alisababivip/core@${{ github.ref_name }}` |
            | `@alisababivip/vue`    | `${{ github.ref_name }}` | `pnpm add @alisababivip/vue@${{ github.ref_name }}` |
            | `@alisababivip/react`  | `${{ github.ref_name }}` | `pnpm add @alisababivip/react@${{ github.ref_name }}` |
            | `@alisababivip/blade`  | `${{ github.ref_name }}` | `pnpm add @alisababivip/blade@${{ github.ref_name }}` |

            ### Cài đặt

            Thêm vào `.npmrc` của project:
            ```
            @nlpgroup:registry=https://npm.pkg.github.com
            ```

            Sau đó:
            ```bash
            pnpm add @alisababivip/tokens @alisababivip/core
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
