name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write      # tạo GitHub Release
      id-token: write      # npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần full history cho changeset

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test --if-present

      # ── Publish mỗi package lên npmjs ──────────────────────
      - name: Publish @nlpgroup/tokens
        run: pnpm publish --filter @nlpgroup/tokens --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nlpgroup/icons
        run: pnpm publish --filter @nlpgroup/icons --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nlpgroup/core
        run: pnpm publish --filter @nlpgroup/core --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nlpgroup/vue
        run: pnpm publish --filter @nlpgroup/vue --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nlpgroup/react
        run: pnpm publish --filter @nlpgroup/react --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nlpgroup/blade
        run: pnpm publish --filter @nlpgroup/blade --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Tạo GitHub Release tự động ──────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 📦 Packages Published

            | Package | Version |
            |---------|---------|
            | `@nlpgroup/tokens` | ${{ github.ref_name }} |
            | `@nlpgroup/icons`  | ${{ github.ref_name }} |
            | `@nlpgroup/core`   | ${{ github.ref_name }} |
            | `@nlpgroup/vue`    | ${{ github.ref_name }} |
            | `@nlpgroup/react`  | ${{ github.ref_name }} |
            | `@nlpgroup/blade`  | ${{ github.ref_name }} |

            ```bash
            pnpm add @nlpgroup/tokens@${{ github.ref_name }}
            pnpm add @nlpgroup/core@${{ github.ref_name }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
